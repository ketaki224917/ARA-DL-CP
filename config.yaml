llm:
  base_url: http://localhost:11434
  model: qwen2.5:1.5b
  request_timeout_seconds: 120
  temperature: 0.0
embeddings:
  model: embeddinggemma
  cache_path: data/indexes/embeddings.sqlite3
paths:
  data_dir: data
  ingest_source_dir: data/sample_corpus
  vector_store_dir: data/indexes/chroma
  bm25_index_path: data/indexes/bm25.json
  ingest_manifest_path: data/indexes/ingest_manifest.json
  dl_data_path: data/dl_data/synthetic_pairs.jsonl
  dl_public_data_dir: data/dl_data/scifact_subset
  dl_public_archive_path: data/dl_data/cache/scifact.tar.gz
  output_dir: outputs
  trace_dir: traces
retrieval:
  chunk_size: 900
  chunk_overlap: 120
  top_k: 8
  reranker_model: cross-encoder/ms-marco-MiniLM-L6-v2
  min_evidence_score: 0.012
  max_evidence_chunks: 8
dl:
  seed: 42
  questions_per_chunk: 2
  candidate_k: 20
  negative_pool_size: 1
  public_max_queries: 200

