[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ara-research-agent"
version = "0.1.0"
description = "A local-first research and report agent with cited evidence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "chromadb>=0.5,<2",
  "httpx>=0.27,<1",
  "json-repair>=0.35,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "psutil>=6,<8",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]
rerank = ["sentence-transformers>=5,<7"]

[project.scripts]
ara = "ara.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

