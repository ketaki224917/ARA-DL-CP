[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ara-research-agent"
version = "0.1.0"
description = "A local-first research and report agent with cited evidence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "chromadb>=0.5,<2",
  "ddgs>=9,<10",
  "httpx>=0.27,<1",
  "json-repair>=0.35,<1",
  "mcp>=2,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "psutil>=6,<8",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
]
rerank = ["sentence-transformers>=5,<7"]
dl = [
  "torch>=2.6,<3",
  "transformers>=4.52,<5",
]

[project.scripts]
ara = "ara.cli:main"
ara-rag-mcp = "ara.mcp_servers.rag_server:main"
ara-web-search-mcp = "ara.mcp_servers.web_search_server:main"
ara-dl-model-mcp = "ara.mcp_servers.dl_model_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers"]
follow_imports = "skip"

[tool.uv.sources]
torch = { index = "pytorch-cpu", extra = "dl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

